[project]
name = "missing-values-imputation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
]
